name: Sayısal Loto Sonuç Bildirimi

on:
  schedule:
    # Pazartesi / Çarşamba / Cumartesi 22:30 Türkiye = 19:30 UTC
    - cron: '30 19 * * 1,3,6'
  workflow_dispatch:  # GitHub > Actions sekmesinden manuel test için

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 lxml

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_results.py
